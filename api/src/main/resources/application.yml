spring:
  application:
    name: blogapi
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/blogapi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
  jpa:
    hibernate:
      # 스키마는 Flyway가 관리한다. Hibernate는 검증만 한다.
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # 2주차 N+1 실험 - SQL 템플릿(?)뿐 아니라 실제 바인딩된 값도 로그로 보고 싶을 때 켠다.
    org.hibernate.orm.jdbc.bind: TRACE
